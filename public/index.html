<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c4a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Dolly G</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=fast2" />
    <script src="./config.js?v=fast2"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
    </div>

    <main class="shell">
      <header class="hero">
   
      </header>

      <button id="checkBtn" type="button">
        <span class="btn-label">Check status</span>
        <span class="btn-shine" aria-hidden="true"></span>
      </button>

      <label id="passportToggle" class="toggle">
        <input type="checkbox" id="passportCheckbox" />
        <span>Also check Passport</span>
      </label>

      <p id="live" class="live" hidden></p>
      <section id="error" class="error" hidden></section>

      <section id="panel" class="panel" hidden>
        <p id="stamp" class="meta"></p>

        <article id="gstBlock" class="card" hidden>
          <div class="card-top">
            <h2>GST</h2>
            <span class="pill">ARN</span>
          </div>
          <dl id="gstFields"></dl>
          <p id="gstError" class="card-error" hidden></p>
        </article>

        <article id="passportBlock" class="card" hidden>
          <div class="card-top">
            <h2>Passport</h2>
            <span class="pill">File</span>
          </div>
          <dl id="passportFields"></dl>
          <p id="passportError" class="card-error" hidden></p>
        </article>
      </section>
    </main>

    <script src="./app.js?v=fast2"></script>
  </body>
</html>

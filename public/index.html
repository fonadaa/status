<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a4d3c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Dolly G</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <main class="shell">
      <h1>Welcome Dolly G</h1>
      <button id="checkBtn" type="button">GST status</button>
      <p id="live" class="live" hidden></p>
      <section id="panel" class="panel" hidden>
        <p id="stamp" class="meta"></p>
        <article class="block">
          <h2>GST</h2>
          <dl id="gstFields"></dl>
        </article>
        <article class="block">
          <h2>Passport</h2>
          <dl id="passportFields"></dl>
        </article>
      </section>
      <section id="error" class="error" hidden></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
